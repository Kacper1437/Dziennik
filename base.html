<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dziennik Demo</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="role-{{ current_user.role if current_user else 'guest' }}"><nav><div class="brand">EduPanel</div>{% if current_user %}<div class="navright"><span>{{ current_user.first_name }} {{ current_user.last_name }}</span><a href="{{url_for('logout')}}">Wyloguj</a></div>{% endif %}</nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
